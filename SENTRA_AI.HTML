<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTRA AI - Neural Core & Smart Engine</title>
    <!-- Библиотека для парсинга Markdown в HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Библиотека для безопасной очистки HTML (защита от XSS) -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <style>
        :root {
            --bg-color: #0B0B0F;
            --sidebar-bg: #111118;
            --chat-bg: #171720;
            --user-msg: #3b2865;
            --ai-msg: #111118;
            --text-color: #FFFFFF;
            --text-secondary: #A1A1AA;
            --accent: #8B5CF6;
            --accent-hover: #A78BFA;
            --border-color: rgba(255,255,255,0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        aside {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .sidebar-header {
            padding: 1.25rem 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .new-chat-btn {
            margin: 0.75rem;
            padding: 0.65rem 1rem;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-color);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s, border-color 0.2s;
            text-align: left;
        }

        .new-chat-btn:hover {
            background-color: var(--chat-bg);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .chat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.65rem 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            background: transparent;
            transition: background 0.2s;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .chat-item:hover {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-color);
        }

        .chat-item.active {
            background-color: var(--chat-bg);
            color: var(--text-color);
        }

        .chat-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 0.5rem;
        }

        .delete-chat-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.2rem 0.4rem;
            border-radius: 0.3rem;
            opacity: 0;
            transition: opacity 0.2s, color 0.2s;
        }

        .chat-item:hover .delete-chat-btn {
            opacity: 1;
        }

        .delete-chat-btn:hover {
            color: #ef4444;
        }

        .sidebar-footer {
            padding: 0.75rem;
            border-top: 1px solid var(--border-color);
        }

        .settings-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.65rem 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            width: 100%;
            text-align: left;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-color);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-color);
            position: relative;
        }

        header {
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .menu-toggle {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1.25rem;
            cursor: pointer;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .message-wrapper {
            width: 100%;
            max-width: 760px;
            display: flex;
        }

        .message-wrapper.user {
            align-items: flex-end;
            justify-content: flex-end;
        }

        .message-wrapper.ai {
            align-items: flex-start;
            justify-content: flex-start;
        }

        @keyframes messageAppear {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message {
            padding: 0.85rem 1.1rem;
            border-radius: 1rem;
            line-height: 1.6;
            word-break: break-word;
            font-size: 0.95rem;
            animation: messageAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .message.user {
            width: fit-content;
            max-width: 75%;
            background: var(--user-msg);
            color: white;
            border-bottom-right-radius: 0.3rem;
            white-space: pre-wrap;
        }

        .message.ai {
            width: fit-content;
            max-width: 75%;
            background: var(--ai-msg);
            color: white;
            border: 1px solid var(--accent);
            border-bottom-left-radius: 0.3rem;
        }

        .markdown-body {
            white-space: normal;
        }

        .markdown-body h1, 
        .markdown-body h2, 
        .markdown-body h3 {
            margin-top: 0.75rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .markdown-body h1 { font-size: 1.25rem; }
        .markdown-body h2 { font-size: 1.1rem; }
        .markdown-body h3 { font-size: 1rem; }

        .markdown-body p {
            margin-bottom: 0.5rem;
        }

        .markdown-body p:last-child {
            margin-bottom: 0;
        }

        .markdown-body ul, 
        .markdown-body ol {
            padding-left: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .markdown-body code {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 0.3rem;
            font-family: monospace;
            font-size: 0.9em;
        }

        .markdown-body pre {
            background: #0B0B0F;
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }

        .markdown-body pre code {
            background: transparent;
            padding: 0;
        }

        .markdown-body a {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .message-attachment-img {
            max-width: 220px;
            max-height: 220px;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            display: block;
            object-fit: cover;
        }

        .message-file-card {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(0, 0, 0, 0.25);
            padding: 0.55rem 0.8rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .windy-btn {
            display: inline-block;
            margin-top: 0.75rem;
            padding: 0.5rem 1rem;
            background-color: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .windy-btn:hover {
            background-color: var(--accent-hover);
        }

        .input-container-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 1rem 1.5rem 1rem;
            background-color: var(--bg-color);
        }

        #input-area {
            width: 100%;
            max-width: 760px;
            background: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.85rem;
            padding: 0.65rem 0.75rem;
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
            transition: border-color 0.2s;
        }

        #input-area:focus-within {
            border-color: rgba(139, 92, 246, 0.4);
        }

        /* Кнопка «+» и анимированное выпадающее меню вложений */
        .attachment-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .plus-btn {
            width: 32px;
            height: 32px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 0.35rem;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            margin-bottom: 2px;
        }

        .plus-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Плавный поворот кнопки в крестик (×) */
        .plus-btn.active {
            transform: rotate(180deg);
            color: var(--text-color);
            border-color: rgba(139, 92, 246, 0.4);
        }

        @keyframes menuAppear {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .attachment-menu {
            display: none;
            position: absolute;
            bottom: 44px;
            left: 0;
            background-color: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.35rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 50;
            min-width: 160px;
            flex-direction: column;
            gap: 0.2rem;
            opacity: 0;
            transform: translateY(8px) scale(0.97);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .attachment-menu.open {
            display: flex;
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            animation: menuAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .attachment-item {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.6rem 0.75rem;
            background: transparent;
            border: none;
            border-radius: 0.4rem;
            color: var(--text-color);
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
            width: 100%;
            transition: background 0.2s;
        }

        .attachment-item:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 0.35rem 0.2rem;
            resize: none;
            height: 24px;
            max-height: 150px;
            font-family: inherit;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        textarea:focus { outline: none; }
        textarea::placeholder { color: var(--text-secondary); }

        .send-btn {
            width: 32px;
            height: 32px;
            background-color: var(--accent);
            border: none;
            border-radius: 0.35rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            flex-shrink: 0;
            margin-bottom: 2px;
        }

        .send-btn .arrow {
            display: inline-block;
            transition: transform 500ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .send-btn.animating .arrow { transform: rotate(180deg); }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .send-btn:not(:disabled):hover { background-color: var(--accent-hover); }

        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        .loading-dots {
            display: flex;
            gap: 5px;
            align-items: center;
            justify-content: center;
            padding: 2px 4px;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            animation: dotPulse 1.2s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background-color: var(--chat-bg);
            border: 1px solid var(--border-color);
            padding: 1.75rem;
            border-radius: 0.85rem;
            width: 380px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .modal h2 { margin: 0; color: var(--text-color); font-size: 1.1rem; }
        .modal-content { display: flex; flex-direction: column; gap: 0.5rem; color: var(--text-secondary); font-size: 0.9rem; }
        .modal-btn { padding: 0.65rem; background-color: #ef4444; border: none; border-radius: 0.5rem; color: white; cursor: pointer; }
        .close-modal-btn { padding: 0.65rem; background-color: transparent; border: 1px solid var(--border-color); border-radius: 0.5rem; color: var(--text-color); cursor: pointer; }

        @media (max-width: 768px) {
            aside { position: absolute; height: 100%; transform: translateX(-100%); }
            aside.open { transform: translateX(0); }
            .menu-toggle { display: block; }
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="sidebar-header">
            <span>SENTRA AI</span>
        </div>
        <button class="new-chat-btn" id="new-chat-btn" onclick="createNewChat()">+ Новый чат</button>
        <div class="chat-list" id="chat-list"></div>
        <div class="sidebar-footer">
            <button class="settings-btn" onclick="openSettings()">Настройки</button>
        </div>
    </aside>

    <main>
        <header>
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <span id="current-chat-title">SENTRA</span>
            </div>
            <div></div>
        </header>

        <div id="chat-container"></div>

        <div class="input-container-wrapper">
            <div id="input-area">
                <!-- Кнопка «+» и выпадающее меню -->
                <div class="attachment-wrapper">
                    <button class="plus-btn" id="plus-btn" title="Прикрепить файл или фото" onclick="toggleAttachmentMenu(event)">+</button>
                    <div class="attachment-menu" id="attachment-menu">
                        <button class="attachment-item" onclick="triggerFileInput('image/*')">📷 Фото</button>
                        <button class="attachment-item" onclick="triggerFileInput('*/*')">📁 Файл</button>
                        <button class="attachment-item" onclick="triggerCameraInput()">📸 Камера</button>
                    </div>
                </div>

                <!-- Скрытые инпуты для загрузки файлов -->
                <input type="file" id="hidden-file-input" style="display: none;" onchange="handleFileSelected(event)">
                <input type="file" id="hidden-camera-input" accept="image/*" capture="environment" style="display: none;" onchange="handleFileSelected(event)">

                <textarea id="user-input" placeholder="Сообщение SENTRA..."></textarea>
                <button id="send-btn" class="send-btn" onclick="submitUserMessage()" disabled>
                    <span class="arrow">↑</span>
                </button>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2>Настройки SENTRA</h2>
            <div class="modal-content">
                <div>Версия: 2.3.0 (Neural Core & Animated Attachments)</div>
                <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem;">Интегрирована долговременная память, плавная анимация вложений и интерфейс чатов.</div>
                <div style="margin-top: 0.5rem; font-family: monospace; font-size: 0.75rem; color: rgba(161, 161, 170, 0.4); letter-spacing: 2px;">... . -. - .-. .-</div>
            </div>
            <button class="modal-btn" onclick="clearAllChats()">Очистить все чаты</button>
            <button class="close-modal-btn" onclick="closeSettings()">Закрыть</button>
        </div>
    </div>

<script>
    marked.setOptions({
        breaks: true,
        gfm: true
    });

    // ========================================
    // ATTACHMENTS & MEDIA MODULE (UI Handler)
    // ========================================
    let pendingAttachment = null;

    function toggleAttachmentMenu(e) {
        e.stopPropagation();
        const menu = document.getElementById('attachment-menu');
        const plusBtn = document.getElementById('plus-btn');
        if (menu && plusBtn) {
            const isOpen = menu.classList.toggle('open');
            plusBtn.classList.toggle('active', isOpen);
            // Визуально превращаем «+» в «×» через спецсимвол при открытии
            plusBtn.textContent = isOpen ? '×' : '+';
        }
    }

    document.addEventListener('click', () => {
        const menu = document.getElementById('attachment-menu');
        const plusBtn = document.getElementById('plus-btn');
        if (menu && menu.classList.contains('open')) {
            menu.classList.remove('open');
            if (plusBtn) {
                plusBtn.classList.remove('active');
                plusBtn.textContent = '+';
            }
        }
    });

    function triggerFileInput(acceptType) {
        const input = document.getElementById('hidden-file-input');
        if (input) {
            input.accept = acceptType;
            input.click();
        }
    }

    function triggerCameraInput() {
        const input = document.getElementById('hidden-camera-input');
        if (input) input.click();
    }

    function handleFileSelected(event) {
        const file = event.target.files[0];
        if (!file) return;

        pendingAttachment = file;
        const userInput = document.getElementById('user-input');
        if (userInput) {
            userInput.placeholder = `Прикреплено: ${file.name}`;
            userInput.focus();
        }
        event.target.value = '';
    }

    // ========================================
    // CHAT & STORAGE CORE
    // ========================================
    let chats = [];
    let activeChatId = null;

    let chatContainer, userInput, sendBtn, chatListContainer, currentChatTitleElem, sidebar, settingsModal;

    document.addEventListener("DOMContentLoaded", () => {
        chatContainer = document.getElementById('chat-container');
        userInput = document.getElementById('user-input');
        sendBtn = document.getElementById('send-btn');
        chatListContainer = document.getElementById('chat-list');
        currentChatTitleElem = document.getElementById('current-chat-title');
        sidebar = document.getElementById('sidebar');
        settingsModal = document.getElementById('settings-modal');

        loadChats();
        loadKnowledgeBase();

        if (chats.length === 0) {
            createNewChat();
        } else {
            activeChatId = chats[0].id;
            renderChatList();
            renderMessages();
        }

        if (userInput) {
            userInput.addEventListener('input', () => {
                userInput.style.height = '24px';
                userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
                updateSendButtonState();
            });

            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!sendBtn.disabled) submitUserMessage();
                }
            });
        }
    });

    function updateSendButtonState() {
        if (!sendBtn || !userInput) return;
        sendBtn.disabled = userInput.value.trim().length === 0 && !pendingAttachment;
    }

    function loadChats() {
        try {
            const saved = localStorage.getItem('sentra_standalone_chats');
            chats = saved ? JSON.parse(saved) : [];
        } catch (e) {
            chats = [];
        }
    }

    function saveChats() {
        try {
            localStorage.setItem('sentra_standalone_chats', JSON.stringify(chats));
        } catch (e) {}
    }

    function createNewChat() {
        const newChat = { id: Date.now(), title: "Новый чат", messages: [] };
        chats.unshift(newChat);
        activeChatId = newChat.id;
        saveChats();
        renderChatList();
        renderMessages();
        if (sidebar && window.innerWidth <= 768) sidebar.classList.remove('open');
    }

    function switchChat(id) {
        activeChatId = id;
        renderChatList();
        renderMessages();
        if (sidebar && window.innerWidth <= 768) sidebar.classList.remove('open');
    }

    function deleteChat(event, id) {
        if (event) event.stopPropagation();
        chats = chats.filter(chat => chat.id !== id);
        if (chats.length === 0) createNewChat();
        else if (activeChatId === id) activeChatId = chats[0].id;
        saveChats();
        renderChatList();
        renderMessages();
    }

    function clearAllChats() {
        if (confirm("Удалить все чаты?")) {
            chats = [];
            createNewChat();
            closeSettings();
        }
    }

    function toggleSidebar() {
        if (sidebar) sidebar.classList.toggle('open');
    }

    function openSettings() {
        if (settingsModal) settingsModal.style.display = 'flex';
    }

    function closeSettings() {
        if (settingsModal) settingsModal.style.display = 'none';
    }

    function renderChatList() {
        if (!chatListContainer) return;
        chatListContainer.innerHTML = '';
        chats.forEach(chat => {
            const item = document.createElement('div');
            item.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
            item.onclick = () => switchChat(chat.id);

            const titleSpan = document.createElement('span');
            titleSpan.className = 'chat-title';
            titleSpan.textContent = chat.title;

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-chat-btn';
            delBtn.textContent = '✕';
            delBtn.onclick = (e) => deleteChat(e, chat.id);

            item.appendChild(titleSpan);
            item.appendChild(delBtn);
            chatListContainer.appendChild(item);
        });
    }

    function renderMessages() {
        if (!chatContainer) return;
        chatContainer.innerHTML = '';

        const activeChat = chats.find(c => c.id === activeChatId);
        if (!activeChat) return;

        if (currentChatTitleElem) {
            currentChatTitleElem.textContent = activeChat.title;
        }

        activeChat.messages.forEach(msg => {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${msg.sender}`;

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${msg.sender}`;

            if (msg.attachment) {
                if (msg.attachment.url && msg.attachment.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = msg.attachment.url;
                    img.className = 'message-attachment-img';
                    messageDiv.appendChild(img);
                } else {
                    const fileCard = document.createElement('div');
                    fileCard.className = 'message-file-card';
                    fileCard.innerHTML = `
                        <span>📁</span>
                        <div>
                            <div style="font-weight: 500;">${msg.attachment.name}</div>
                            <div style="font-size: 0.75rem; color: var(--text-secondary);">${Math.round(msg.attachment.size / 1024)} KB</div>
                        </div>
                    `;
                    messageDiv.appendChild(fileCard);
                }
            }

            if (msg.text) {
                if (msg.sender === 'ai') {
                    const rawHtml = marked.parse(msg.text);
                    const htmlContainer = document.createElement('div');
                    htmlContainer.className = 'markdown-body';
                    htmlContainer.innerHTML = DOMPurify.sanitize(rawHtml);
                    messageDiv.appendChild(htmlContainer);
                } else {
                    const textSpan = document.createElement('div');
                    textSpan.textContent = msg.text;
                    messageDiv.appendChild(textSpan);
                }
            }

            wrapper.appendChild(messageDiv);
            chatContainer.appendChild(wrapper);
        });

        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // ========================================
    // LONG-TERM MEMORY MODULE (localStorage)
    // ========================================
    const MEMORY_KEY = 'sentra_long_term_memory';

    function loadSentraMemory() {
        try {
            const data = localStorage.getItem(MEMORY_KEY);
            return data ? JSON.parse(data) : [];
        } catch (e) {
            return [];
        }
    }

    function saveSentraMemory(memoryArray) {
        try {
            localStorage.setItem(MEMORY_KEY, JSON.stringify(memoryArray));
        } catch (e) {}
    }

    function addMemory(fact) {
        if (!fact || typeof fact !== 'string') return;
        const clean = fact.trim();
        if (clean.length < 2) return;
        
        let memory = loadSentraMemory();
        if (!memory.includes(clean)) {
            memory.push(clean);
            saveSentraMemory(memory);
        }
    }

    function removeMemory(query) {
        let memory = loadSentraMemory();
        const lowerQuery = query.toLowerCase();
        const filtered = memory.filter(item => !item.toLowerCase().includes(lowerQuery));
        saveSentraMemory(filtered);
    }

    function getRelevantMemory(text) {
        let memory = loadSentraMemory();
        if (memory.length === 0) return "";
        
        const lower = text.toLowerCase();
        if (lower.includes('что ты помнишь') || lower.includes('о мне')) {
            return "Факты о пользователе:\n- " + memory.join("\n- ");
        }

        const words = lower.split(/\s+/).filter(w => w.length > 3);
        const relevant = memory.filter(item => {
            const itemLower = item.toLowerCase();
            return words.some(w => itemLower.includes(w));
        });

        if (relevant.length > 0) {
            return "Релевантный контекст:\n- " + relevant.join("\n- ");
        }
        
        return "Факты о пользователе: " + memory.join("; ");
    }

    function handleMemoryCommands(text) {
        const lower = text.toLowerCase().trim();

        if (lower === 'что ты помнишь обо мне?' || lower === 'что ты помнишь обо мне' || lower === 'что помнишь обо мне') {
            const memory = loadSentraMemory();
            if (memory.length === 0) {
                return "Я пока ничего не запомнила о тебе. Попроси меня: «Запомни, что меня зовут Алекс» или «Мой любимый цвет — синий».";
            }
            return "Вот что я помню о тебе:\n" + memory.map(m => "— " + m).join("\n");
        }

        if (lower.startsWith('забудь это') || lower.startsWith('забудь ')) {
            const target = text.replace(/^забудь\s+(это)?/i, '').trim();
            if (!target || target.toLowerCase() === 'это') {
                localStorage.removeItem(MEMORY_KEY);
                return "Я полностью очистила всю долговременную память о тебе.";
            } else {
                removeMemory(target);
                return `Я удалила из памяти информацию, связанную с: "${target}"`;
            }
        }

        let extractedFact = null;
        if (lower.startsWith('запомни, что ')) {
            extractedFact = text.substring(13).trim();
        } else if (lower.startsWith('запомни: ')) {
            extractedFact = text.substring(9).trim();
        } else if (lower.startsWith('запомни ')) {
            extractedFact = text.substring(8).trim();
        } else if (lower.startsWith('меня зовут ')) {
            extractedFact = `Меня зовут ${text.substring(11).trim()}`;
        } else if (lower.startsWith('мой любимый ') || lower.startsWith('моя любимая ') || lower.startsWith('моё любимое ')) {
            extractedFact = text.trim();
        } else if (lower.startsWith('мне нравится ')) {
            extractedFact = text.trim();
        }

        if (extractedFact) {
            addMemory(extractedFact);
            return `Запомнила! Теперь я знаю: ${extractedFact}`;
        }

        return null;
    }

    // ========================================
    // KNOWLEDGE BASE CORE & PERSISTENCE
    // ========================================
    const defaultKnowledgeBase = {
        "привет": "Здравствуйте! Я SENTRA AI. Чем могу помочь?",
        "прив": "Здравствуйте! Я SENTRA AI. Чем могу помочь?",
        "здравствуй": "Здравствуйте! Я SENTRA AI. Чем могу помочь?",
        "здравствуйте": "Здравствуйте! Я SENTRA AI. Чем могу помочь?",
        
        "кто ты": "Я SENTRA AI. Ваш виртуальный помощник.",
        "как тебя зовут": "Я SENTRA AI. Ваш виртуальный помощник.",
        "что ты такое": "Я SENTRA AI. Ваш виртуальный помощник.",
        
        "что умеешь": "Отвечаю на вопросы, даю советы, помогаю с учебой и работой.",
        "что ты умеешь": "Отвечаю на вопросы, даю советы, помогаю с учебой и работой.",
        "что умеешь делать": "Отвечаю на вопросы, даю советы, помогаю с учебой и работой.",
        "что ты можешь": "Отвечаю на вопросы, даю советы, помогаю с учебой и работой.",
        "какие у тебя возможности": "Отвечаю на вопросы, даю советы, помогаю с учебой и работой.",
        
        "пока": "До свидания! Обращайтесь если понадобится помощь.",
        "что делать": "Это зависит от ситуации. Могу предложить: поработать, отдохнуть, почитать, заняться спортом.",
        "мне грустно": "Понимаю вас. Хотите поговорить? Иногда помогает прогулка или разговор с близкими."
    };

    let knowledgeBase = {};

    function loadKnowledgeBase() {
        try {
            const saved = localStorage.getItem('sentra_knowledge_base');
            if (saved) {
                const parsed = JSON.parse(saved);
                knowledgeBase = Object.assign({}, defaultKnowledgeBase, parsed);
            } else {
                knowledgeBase = Object.assign({}, defaultKnowledgeBase);
                saveKnowledgeBase();
            }
        } catch (e) {
            knowledgeBase = Object.assign({}, defaultKnowledgeBase);
        }
    }

    function saveKnowledgeBase() {
        try {
            localStorage.setItem('sentra_knowledge_base', JSON.stringify(knowledgeBase));
        } catch (e) {}
    }

    // ========================================
    // QUERY CORRECTOR & SLANG UNDERSTANDING
    // ========================================
    function understandQuery(query) {
        const original = query.trim();
        let normalized = original;

        const slangMap = {
            'хз': 'не знаю',
            'пр': 'привет',
            'спс': 'спасибо',
            'пж': 'пожалуйста',
            'го': 'давай',
            'че': 'что',
            'чё': 'что'
        };

        const typoMap = {
            'олбирт инштеин': 'Альберт Эйнштейн',
            'олберт инштейн': 'Альберт Эйнштейн',
            'алберт энштейн': 'Альберт Эйнштейн'
        };

        let lowerClean = original.toLowerCase().replace(/[?!.]+$/, '').trim();

        if (typoMap[lowerClean]) {
            normalized = typoMap[lowerClean];
        } else {
            let words = original.split(/\s+/);
            let modified = false;
            let processedWords = words.map(w => {
                let cleanW = w.toLowerCase().replace(/[?!.,]+$/, '');
                if (cleanW === 'питон') return w;
                if (slangMap[cleanW]) {
                    modified = true;
                    return w.replace(new RegExp(cleanW, 'i'), slangMap[cleanW]);
                }
                return w;
            });

            if (modified) {
                normalized = processedWords.join(' ');
            } else {
                for (let [typoKey, correctVal] of Object.entries(typoMap)) {
                    if (lowerClean.includes(typoKey)) {
                        normalized = original.toLowerCase().replace(typoKey, correctVal);
                        normalized = normalized.charAt(0).toUpperCase() + normalized.slice(1);
                        break;
                    }
                }
            }
        }

        return { original, normalized };
    }

    // ========================================
    // AI ROUTER & INTENT DETECTION
    // ========================================
    function detectIntent(text) {
        const lower = text.toLowerCase().trim();

        if (lower.startsWith('/') || lower === 'очистить') return "command";
        if (knowledgeBase[lower]) return "knowledge_base";

        if (lower.includes('кто тебя создал') || lower.includes('автор sentra')) return "creator";
        if (['сколько будет', 'посчитай', '+', '-', '*', '/', '^', '%'].some(w => lower.includes(w)) || /^[\d\s\+\-\*\/\(\)\.\^%]+$/.test(lower)) return "calculator";
        if (['погода', 'погоду', 'градусов', 'дождь', 'ветер', 'температур'].some(w => lower.includes(w))) return "weather";
        if (lower.includes('время')) return "time";
        if (lower.includes('дата')) return "date";
        
        if (['кто такой', 'что такое'].some(w => lower.startsWith(w)) || lower.includes('эйнштейн')) {
            return "wikipedia";
        }

        return "ai_model";
    }

    // ========================================
    // SEARCH & PROXY AI MODULES
    // ========================================
    async function searchWikipedia(query) {
        let extracted = query.replace(/^(кто такой|что такое|расскажи про|найди в википедии)\s+/i, '').trim();
        try {
            const url = `https://ru.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(extracted)}&format=json&origin=*`;
            const res = await fetch(url);
            const data = await res.json();
            const pages = data?.query?.search || [];
            if (pages.length === 0) return null;
            const best = pages[0];
            const title = best.title;
            const snippet = best.snippet ? best.snippet.replace(/<[^>]*>/g, '') : "";
            const pageUrl = `https://ru.wikipedia.org/wiki/${encodeURIComponent(title.replace(/ /g, '_'))}`;
            return {
                title: title,
                text: snippet,
                sources: [{ name: `Wikipedia — ${title}`, url: pageUrl }]
            };
        } catch (e) {
            return null;
        }
    }

    async function askAI(message, context, memoryContext) {
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message, context: context, memoryContext: memoryContext })
            });
            if (!response.ok) throw new Error('Proxy API error');
            const data = await response.json();
            return data.answer || data.reply || "Не удалось получить ответ от нейросети.";
        } catch (e) {
            return `Нейросетевой модуль обработал запрос: «${message}». ${memoryContext ? 'Учтено из памяти: ' + memoryContext : ''}`;
        }
    }

    function getSources(sourcesList) {
        if (!sourcesList || sourcesList.length === 0) return "";
        let formatted = "\n\nИсточники:\n";
        sourcesList.forEach(src => {
            if (src.url) {
                formatted += `• <a href="${src.url}" target="_blank">${src.name}</a>\n`;
            } else {
                formatted += `• ${src.name}\n`;
            }
        });
        return formatted.trim();
    }

    // ========================================
    // UTILS & LOCAL MODULES
    // ========================================
    function calculate(expression) {
        try {
            let clean = expression.replace(/[^0-9+\-*/().^%]/g, '').replace(/\^/g, '**');
            if (!clean) return null;
            const result = Function('"use strict";return (' + clean + ')')();
            return (typeof result === 'number' && !isNaN(result)) ? result : null;
        } catch (e) { return null; }
    }

    function getCurrentTime() { return new Date().toLocaleTimeString('ru-RU'); }
    function getCurrentDate() { return new Date().toLocaleDateString('ru-RU', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' }); }

    const staticCityFallbacks = {
        'Oskemen': { name: 'Oskemen', latitude: 49.982, longitude: 82.6067 },
        'Усть-Каменогорск': { name: 'Усть-Каменогорск', latitude: 49.982, longitude: 82.6067 },
        'Алматы': { name: 'Алматы', latitude: 43.2567, longitude: 76.9286 },
        'Москва': { name: 'Москва', latitude: 55.7522, longitude: 37.6156 }
    };

    async function handleWeatherQuery(text) {
        const lower = text.toLowerCase();
        let foundCity = 'Усть-Каменогорск';
        for (const [alias, data] of Object.entries(staticCityFallbacks)) {
            if (lower.includes(alias.toLowerCase())) { foundCity = data.name; break; }
        }
        const loc = staticCityFallbacks[foundCity] || staticCityFallbacks['Усть-Каменогорск'];
        try {
            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m&timezone=auto`);
            const data = await weatherRes.json();
            if (data?.current) {
                const c = data.current;
                const windyUrl = `https://www.windy.com/?${loc.latitude},${loc.longitude},11`;
                return `Погода в г. **${loc.name}** сейчас:\n• Температура: ${c.temperature_2m}°C\n• Ощущается как: ${c.apparent_temperature}°C\n• Влажность: ${c.relative_humidity_2m}%\n• Ветер: ${c.wind_speed_10m} м/с<br><a href="${windyUrl}" target="_blank" class="windy-btn">🌦️ Открыть Windy</a>`;
            }
            return "Не удалось получить данные о погоде.";
        } catch (e) { return "Ошибка получения погоды. ⚠️"; }
    }

    // ========================================
    // ANSWER GENERATOR MODULE
    // ========================================
    async function generateAnswer(userQuery, normalizedQuery, intent) {
        const lower = normalizedQuery.toLowerCase().trim();

        if (intent === "knowledge_base" || knowledgeBase[lower]) {
            return { text: knowledgeBase[lower], sources: [] };
        }

        if (intent === "command") {
            return { text: "Команда выполнена. ✅", sources: [] };
        }
        if (intent === "creator") {
            return { text: "Меня создал мой разработчик — человек, который придумал и собрал SENTRA AI. 🤖 Я постоянно учусь отвечать точно и по делу.", sources: [] };
        }
        if (intent === "calculator") {
            const res = calculate(normalizedQuery);
            if (res !== null) return { text: `Результат: **${res}**`, sources: [] };
        }
        if (intent === "weather") {
            const weatherText = await handleWeatherQuery(normalizedQuery);
            return { text: weatherText, sources: [] };
        }
        if (intent === "time") {
            return { text: `Текущее время: **${getCurrentTime()}**`, sources: [] };
        }
        if (intent === "date") {
            return { text: `Сегодня: **${getCurrentDate()}**`, sources: [] };
        }
        if (intent === "wikipedia") {
            const wiki = await searchWikipedia(normalizedQuery);
            if (wiki) {
                return { text: `### ${wiki.title}\n\n${wiki.text}`, sources: wiki.sources };
            }
        }

        const memoryContext = getRelevantMemory(normalizedQuery);
        const aiReply = await askAI(normalizedQuery, "", memoryContext);
        return { text: aiReply, sources: [] };
    }

    // ========================================
    // MESSAGE SUBMISSION & FLOW HANDLER
    // ========================================
    async function submitUserMessage() {
        if (!userInput || !sendBtn) return;
        const text = userInput.value.trim();
        if (!text && !pendingAttachment) return;

        const currentAttachment = pendingAttachment;
        pendingAttachment = null;

        userInput.value = '';
        userInput.style.height = '24px';
        userInput.placeholder = "Сообщение SENTRA...";
        updateSendButtonState();

        const activeChat = chats.find(c => c.id === activeChatId);
        if (!activeChat) return;

        if (text && !currentAttachment) {
            const memoryResult = handleMemoryCommands(text);
            if (memoryResult) {
                activeChat.messages.push({ sender: 'user', text: text });
                activeChat.messages.push({ sender: 'ai', text: memoryResult });
                if (activeChat.title === "Новый чат") {
                    activeChat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
                }
                saveChats();
                renderChatList();
                renderMessages();
                return;
            }
        }

        const { original, normalized } = understandQuery(text || (currentAttachment ? `Файл: ${currentAttachment.name}` : ''));

        const userMessageObj = { 
            sender: 'user', 
            text: text 
        };

        if (currentAttachment) {
            userMessageObj.attachment = {
                name: currentAttachment.name,
                type: currentAttachment.type,
                size: currentAttachment.size,
                url: currentAttachment.type.startsWith('image/') ? URL.createObjectURL(currentAttachment) : null
            };
        }

        activeChat.messages.push(userMessageObj);
        
        const titleSource = text || (currentAttachment ? currentAttachment.name : "Чат");
        if (activeChat.title === "Новый чат") {
            activeChat.title = titleSource.length > 25 ? titleSource.substring(0, 25) + '...' : titleSource;
        }
        saveChats();
        renderChatList();
        renderMessages();

        const loadingId = 'loading_' + Date.now();
        activeChat.messages.push({ sender: 'ai', text: '<div class="loading-dots"><span></span><span></span><span></span></div>', id: loadingId });
        renderMessages();

        const intent = detectIntent(normalized);
        const answerObj = await generateAnswer(original, normalized, intent);

        let finalAnswerText = answerObj.text;
        if (answerObj.sources && answerObj.sources.length > 0) {
            finalAnswerText += getSources(answerObj.sources);
        }

        activeChat.messages = activeChat.messages.filter(m => m.id !== loadingId);
        activeChat.messages.push({ sender: 'ai', text: finalAnswerText });
        saveChats();
        renderMessages();
    }
