<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTRA AI - Neural Core & Smart Engine</title>
    <!-- Библиотека для парсинга Markdown в HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Библиотека для безопасной очистки HTML (защита от XSS) -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <style>
        :root {
            --bg-color: #0d0d12;
            --sidebar-bg: #13131a;
            --chat-bg: #181822;
            --user-msg: #7c3aed;
            --ai-msg: #181822;
            --text-color: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent: #8b5cf6;
            --accent-hover: #a78bfa;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* Layout */
        .app-layout {
            display: flex;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            position: relative;
            overflow: hidden;
        }

        aside {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            height: 100%;
        }

        .sidebar-header {
            padding: 1rem 1.25rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-search-container {
            padding: 0.75rem 1rem 0.25rem 1rem;
        }

        .sidebar-search {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .sidebar-search:focus {
            border-color: var(--accent);
        }

        .new-chat-btn {
            margin: 0.75rem 1rem;
            padding: 0.75rem 1rem;
            background: linear-gradient(135deg, var(--accent), #6d28d9);
            border: none;
            border-radius: 0.75rem;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
        }

        .new-chat-btn:active {
            transform: scale(0.98);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .chat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            border-radius: 0.6rem;
            cursor: pointer;
            background: transparent;
            transition: background 0.2s, color 0.2s;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .chat-item:hover {
            background-color: rgba(255, 255, 255, 0.04);
            color: var(--text-color);
        }

        .chat-item.active {
            background-color: rgba(139, 92, 246, 0.15);
            color: var(--text-color);
            font-weight: 500;
        }

        .chat-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 0.5rem;
        }

        .delete-chat-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.95rem;
            padding: 0.2rem 0.4rem;
            border-radius: 0.3rem;
            opacity: 0;
            transition: opacity 0.2s, color 0.2s;
        }

        .chat-item:hover .delete-chat-btn {
            opacity: 1;
        }

        .delete-chat-btn:hover {
            color: #ef4444;
        }

        .sidebar-footer {
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border-color);
        }

        .settings-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.75rem;
            border-radius: 0.6rem;
            cursor: pointer;
            width: 100%;
            text-align: left;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            background-color: rgba(255, 255, 255, 0.04);
            color: var(--text-color);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
        }

        header {
            height: 60px;
            padding: 0 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .menu-toggle {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1.25rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 0.5rem;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .menu-toggle:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        #current-chat-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-color);
            max-width: 260px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sentra-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        /* Chat Container */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            scroll-behavior: smooth;
        }

        /* Welcome Screen */
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            padding: 2rem 1rem;
            max-width: 650px;
            margin: auto;
        }

        .welcome-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            margin-bottom: 1rem;
            border: 2px solid var(--accent);
            object-fit: cover;
        }

        .welcome-container h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .welcome-container p {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .quick-actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            width: 100%;
        }

        .quick-action-card {
            background: var(--chat-bg);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 0.85rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            color: var(--text-color);
            font-size: 16px;
            font-weight: 500;
        }

        .quick-action-card:hover {
            border-color: var(--accent);
            background: rgba(139, 92, 246, 0.05);
            transform: translateY(-2px);
        }

        .message-wrapper {
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .message-wrapper.user {
            align-items: flex-end;
        }

        .message-wrapper.ai {
            align-items: flex-start;
        }

        @keyframes messageAppear {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message {
            padding: 0.9rem 1.15rem;
            border-radius: 1.1rem;
            line-height: 1.6;
            word-break: break-word;
            font-size: 16px;
            animation: messageAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .message.user {
            max-width: 80%;
            background: var(--user-msg);
            color: white;
            border-bottom-right-radius: 0.35rem;
            white-space: pre-wrap;
        }

        .message.ai {
            width: 100%;
            background: var(--ai-msg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 0.35rem;
        }

        .markdown-body {
            width: 100%;
        }

        .markdown-body h1, 
        .markdown-body h2, 
        .markdown-body h3 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .markdown-body h1 { font-size: 1.3rem; }
        .markdown-body h2 { font-size: 1.15rem; }
        .markdown-body h3 { font-size: 1.05rem; }

        .markdown-body p {
            margin-bottom: 0.75rem;
        }

        .markdown-body p:last-child {
            margin-bottom: 0;
        }

        .markdown-body ul, 
        .markdown-body ol {
            padding-left: 1.25rem;
            margin-bottom: 0.75rem;
        }

        .markdown-body code {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 0.3rem;
            font-family: monospace;
            font-size: 0.9em;
        }

        .markdown-body pre {
            background: #111116;
            border: 1px solid var(--border-color);
            padding: 0.85rem;
            border-radius: 0.6rem;
            overflow-x: auto;
            margin: 0.75rem 0;
        }

        .markdown-body pre code {
            background: transparent;
            padding: 0;
        }

        .markdown-body a {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .message-attachment-img {
            max-width: 100%;
            max-height: 260px;
            border-radius: 0.6rem;
            margin-bottom: 0.75rem;
            display: block;
            object-fit: cover;
        }

        .message-file-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.65rem 0.9rem;
            border-radius: 0.6rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
        }

        .windy-btn {
            display: inline-block;
            margin-top: 0.75rem;
            padding: 0.5rem 1rem;
            background-color: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .windy-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Input Area */
        .input-container-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0px)) 1rem;
            background-color: var(--bg-color);
            z-index: 20;
        }

        #input-area {
            width: 100%;
            max-width: 780px;
            background: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 0.5rem 0.75rem;
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        #input-area:focus-within {
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.15);
        }

        .attachment-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .plus-btn {
            width: 38px;
            height: 38px;
            background-color: transparent;
            border: none;
            border-radius: 50%;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-bottom: 2px;
        }

        .plus-btn:hover {
            background-color: rgba(255, 255, 255, 0.06);
            color: var(--text-color);
        }

        .plus-btn.active {
            transform: rotate(45deg);
            color: var(--text-color);
            background-color: rgba(255, 255, 255, 0.08);
        }

        @keyframes menuAppear {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .attachment-menu {
            display: none;
            position: absolute;
            bottom: 48px;
            left: 0;
            background-color: #1f1f2b;
            border: 1px solid var(--border-color);
            border-radius: 0.85rem;
            padding: 0.4rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            z-index: 50;
            min-width: 170px;
            flex-direction: column;
            gap: 0.2rem;
            opacity: 0;
            transform: translateY(8px) scale(0.97);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .attachment-menu.open {
            display: flex;
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            animation: menuAppear 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .attachment-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 0.85rem;
            background: transparent;
            border: none;
            border-radius: 0.5rem;
            color: var(--text-color);
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            width: 100%;
            transition: background 0.2s;
        }

        .attachment-item:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 0.6rem 0.2rem;
            resize: none;
            height: 24px;
            max-height: 150px;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.4;
        }

        textarea:focus { outline: none; }
        textarea::placeholder { color: var(--text-secondary); }

        .send-btn {
            width: 38px;
            height: 38px;
            background-color: var(--accent);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background-color 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
            flex-shrink: 0;
            margin-bottom: 2px;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.4);
        }

        .send-btn .arrow {
            display: inline-block;
            transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .send-btn.animating .arrow { transform: scale(1.15); }
        .send-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
        .send-btn:not(:disabled):hover { background-color: var(--accent-hover); transform: scale(1.05); }

        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        .loading-dots {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 4px 8px;
        }

        .loading-dots span {
            width: 7px;
            height: 7px;
            background-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            animation: dotPulse 1.2s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal {
            background-color: var(--chat-bg);
            border: 1px solid var(--border-color);
            padding: 1.75rem;
            border-radius: 1rem;
            width: 400px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: menuAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .modal h2 { margin: 0; color: var(--text-color); font-size: 1.2rem; font-weight: 600; }
        .modal-content { display: flex; flex-direction: column; gap: 0.5rem; color: var(--text-secondary); font-size: 16px; line-height: 1.5; }
        .modal-btn { padding: 0.75rem; background-color: #ef4444; border: none; border-radius: 0.6rem; color: white; cursor: pointer; font-weight: 500; transition: opacity 0.2s; }
        .modal-btn:hover { opacity: 0.9; }
        .close-modal-btn { padding: 0.75rem; background-color: transparent; border: 1px solid var(--border-color); border-radius: 0.6rem; color: var(--text-color); cursor: pointer; font-weight: 500; transition: background 0.2s; }
        .close-modal-btn:hover { background: rgba(255,255,255,0.05); }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
            z-index: 99;
        }
        .sidebar-backdrop.active { display: block; }

        @media (max-width: 768px) {
            aside {
                position: fixed;
                top: 0; left: 0;
                transform: translateX(-100%);
                box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            }
            aside.open {
                transform: translateX(0);
            }
            .menu-toggle {
                display: flex;
            }
            .quick-actions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar()"></div>

    <div class="app-layout">
        <aside id="sidebar">
            <div class="sidebar-header">
                <span>SENTRA AI</span>
                <button class="menu-toggle" onclick="toggleSidebar()" style="width: 30px; height: 30px; font-size: 1rem; display: flex;">✕</button>
            </div>
            <button class="new-chat-btn" onclick="createNewChat()">
                <span>+</span> Новый чат
            </button>
            <div class="sidebar-search-container">
                <input type="text" class="sidebar-search" id="chat-search" placeholder="Поиск чатов..." oninput="filterChats(this.value)">
            </div>
            <div class="chat-list" id="chat-list"></div>
            <div class="sidebar-footer">
                <button class="settings-btn" onclick="openSettings()">
                    <span>⚙️</span> Настройки
                </button>
            </div>
        </aside>

        <main>
            <header>
                <div class="header-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    <span id="current-chat-title">SENTRA</span>
                </div>
                <img src="sentra-avatar.jpg" class="sentra-avatar" alt="SENTRA">
            </header>

            <div id="chat-container"></div>

            <div class="input-container-wrapper">
                <div id="input-area">
                    <!-- Кнопка «+» и выпадающее меню -->
                    <div class="attachment-wrapper">
                        <button class="plus-btn" id="plus-btn" title="Прикрепить файл или фото" onclick="toggleAttachmentMenu(event)">+</button>
                        <div class="attachment-menu" id="attachment-menu">
                            <button class="attachment-item" onclick="triggerFileInput('image/*')">📷 Фото</button>
                            <button class="attachment-item" onclick="triggerFileInput('*/*')">📁 Файл</button>
                            <button class="attachment-item" onclick="triggerCameraInput()">📸 Камера</button>
                        </div>
                    </div>

                    <!-- Скрытые инпуты для загрузки файлов -->
                    <input type="file" id="hidden-file-input" style="display: none;" onchange="handleFileSelected(event)">
                    <input type="file" id="hidden-camera-input" accept="image/*" capture="environment" style="display: none;" onchange="handleFileSelected(event)">

                    <textarea id="user-input" placeholder="Сообщение SENTRA..."></textarea>
                    
                    <button id="send-btn" class="send-btn" onclick="submitUserMessage()" disabled>
                        <span class="arrow">↑</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2>Настройки SENTRA</h2>
            <div class="modal-content">
                <div>Версия: 3.1.0 (Mobile Native AI Engine)</div>
                <div style="font-size: 16px; color: var(--text-secondary); margin-top: 0.25rem;">Интегрирована долговременная память, плавная анимация вложений, мобильный интерфейс и полная совместимость с WebView.</div>
                <div style="margin-top: 0.5rem; font-family: monospace; font-size: 14px; color: rgba(161, 161, 170, 0.4); letter-spacing: 2px;">... . -. - .-. .-</div>
            </div>
            <button class="modal-btn" onclick="clearAllChats()">Очистить все чаты</button>
            <button class="close-modal-btn" onclick="closeSettings()">Закрыть</button>
        </div>
    </div>

<script>
    marked.setOptions({
        breaks: true,
        gfm: true
    });

    // ========================================
    // ATTACHMENTS & MEDIA MODULE (UI Handler)
    // ========================================
    let pendingAttachment = null;

    function toggleAttachmentMenu(e) {
        e.stopPropagation();
        const menu = document.getElementById('attachment-menu');
        const plusBtn = document.getElementById('plus-btn');
        if (menu && plusBtn) {
            const isOpen = menu.classList.toggle('open');
            plusBtn.classList.toggle('active', isOpen);
        }
    }

    document.addEventListener('click', () => {
        const menu = document.getElementById('attachment-menu');
        const plusBtn = document.getElementById('plus-btn');
        if (menu && menu.classList.contains('open')) {
            menu.classList.remove('open');
            if (plusBtn) plusBtn.classList.remove('active');
        }
    });

    function triggerFileInput(acceptType) {
        const input = document.getElementById('hidden-file-input');
        if (input) {
            input.accept = acceptType;
            input.click();
        }
    }

    function triggerCameraInput() {
        const input = document.getElementById('hidden-camera-input');
        if (input) input.click();
    }

    function handleFileSelected(event) {
        const file = event.target.files[0];
        if (!file) return;

        pendingAttachment = file;
        const userInput = document.getElementById('user-input');
        if (userInput) {
            userInput.placeholder = `Прикреплено: ${file.name}`;
            userInput.focus();
        }
        updateSendButtonState();
        event.target.value = '';
    }

    // ========================================
    // CHAT & STORAGE CORE
    // ========================================
    let chats = [];
    let activeChatId = null;
    let searchQuery = "";

    let chatContainer, userInput, sendBtn, chatListContainer, currentChatTitleElem, sidebar, sidebarBackdrop, settingsModal;

    document.addEventListener("DOMContentLoaded", () => {
        chatContainer = document.getElementById('chat-container');
        userInput = document.getElementById('user-input');
        sendBtn = document.getElementById('send-btn');
        chatListContainer = document.getElementById('chat-list');
        currentChatTitleElem = document.getElementById('current-chat-title');
        sidebar = document.getElementById('sidebar');
        sidebarBackdrop = document.getElementById('sidebar-backdrop');
        settingsModal = document.getElementById('settings-modal');

        loadChats();
        loadKnowledgeBase();

        if (chats.length === 0) {
            createNewChat();
        } else {
            activeChatId = chats[0].id;
            renderChatList();
            renderMessages();
        }

        if (userInput) {
            userInput.addEventListener('input', () => {
                userInput.style.height = '24px';
                userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
                updateSendButtonState();
            });

            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!sendBtn.disabled) submitUserMessage();
                }
            });
        }
    });

    function updateSendButtonState() {
        if (!sendBtn || !userInput) return;
        sendBtn.disabled = userInput.value.trim().length === 0 && !pendingAttachment;
    }

    function loadChats() {
        try {
            const saved = localStorage.getItem('sentra_standalone_chats');
            chats = saved ? JSON.parse(saved) : [];
        } catch (e) {
            chats = [];
        }
    }

    function saveChats() {
        try {
            localStorage.setItem('sentra_standalone_chats', JSON.stringify(chats));
        } catch (e) {}
    }

    function createNewChat() {
        const newChat = { id: Date.now(), title: "Новый чат", messages: [] };
        chats.unshift(newChat);
        activeChatId = newChat.id;
        saveChats();
        renderChatList();
        renderMessages();
        if (window.innerWidth <= 768) toggleSidebar();
    }

    function switchChat(id) {
        activeChatId = id;
        renderChatList();
        renderMessages();
        if (window.innerWidth <= 768) toggleSidebar();
    }

    function deleteChat(event, id) {
        if (event) event.stopPropagation();
        chats = chats.filter(chat => chat.id !== id);
        if (chats.length === 0) createNewChat();
        else if (activeChatId === id) activeChatId = chats[0].id;
        saveChats();
        renderChatList();
        renderMessages();
    }

    function clearAllChats() {
        if (confirm("Удалить все чаты?")) {
            chats = [];
            createNewChat();
            closeSettings();
        }
    }

    function toggleSidebar() {
        if (sidebar) sidebar.classList.toggle('open');
        if (sidebarBackdrop) sidebarBackdrop.classList.toggle('active');
    }

    function openSettings() {
        if (settingsModal) settingsModal.style.display = 'flex';
    }

    function closeSettings() {
        if (settingsModal) settingsModal.style.display = 'none';
    }

    function filterChats(query) {
        searchQuery = query.toLowerCase().trim();
        renderChatList();
    }

    function insertQuickPrompt(text) {
        if (!userInput) return;
        userInput.value = text;
        userInput.style.height = '24px';
        userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
        userInput.focus();
        updateSendButtonState();
    }

    function renderChatList() {
        if (!chatListContainer) return;
        chatListContainer.innerHTML = '';
        
        const filteredChats = chats.filter(chat => 
            chat.title.toLowerCase().includes(searchQuery)
        );

        if (filteredChats.length === 0) {
            chatListContainer.innerHTML = `<div style="padding: 1rem; text-align: center; color: var(--text-secondary); font-size: 16px;">Чаты не найдены</div>`;
            return;
        }

        filteredChats.forEach(chat => {
            const item = document.createElement('div');
            item.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
            item.onclick = () => switchChat(chat.id);

            const titleSpan = document.createElement('span');
            titleSpan.className = 'chat-title';
            titleSpan.textContent = chat.title;

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-chat-btn';
            delBtn.textContent = '✕';
            delBtn.onclick = (e) => deleteChat(e, chat.id);

            item.appendChild(titleSpan);
            item.appendChild(delBtn);
            chatListContainer.appendChild(item);
        });
    }

    function renderMessages() {
        if (!chatContainer) return;
        chatContainer.innerHTML = '';

        const activeChat = chats.find(c => c.id === activeChatId);
        if (!activeChat) return;

        if (currentChatTitleElem) {
            currentChatTitleElem.textContent = activeChat.title;
        }

        if (activeChat.messages.length === 0) {
            const welcomeDiv = document.createElement('div');
            welcomeDiv.className = 'welcome-container';
            welcomeDiv.innerHTML = `
                <img src="sentra-avatar.jpg" class="welcome-avatar" alt="SENTRA">
                <h1>SENTRA AI</h1>
                <p>Ваш интеллектуальный AI-помощник</p>
                <div class="quick-actions-grid">
                    <div class="quick-action-card" onclick="insertQuickPrompt('Помоги мне')">💡 Помоги мне</div>
                    <div class="quick-action-card" onclick="insertQuickPrompt('Создай текст')">✍️ Создай текст</div>
                    <div class="quick-action-card" onclick="insertQuickPrompt('Проанализируй фото')">👁️ Проанализируй фото</div>
                    <div class="quick-action-card" onclick="insertQuickPrompt('Помоги с работой')">💼 Помоги с работой</div>
                </div>
            `;
            chatContainer.appendChild(welcomeDiv);
            return;
        }

        activeChat.messages.forEach(msg => {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${msg.sender}`;

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${msg.sender}`;

            if (msg.attachment) {
                if (msg.attachment.url && msg.attachment.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = msg.attachment.url;
                    img.className = 'message-attachment-img';
                    messageDiv.appendChild(img);
                } else {
                    const fileCard = document.createElement('div');
                    fileCard.className = 'message-file-card';
                    fileCard.innerHTML = `
                        <span>📁</span>
                        <div>
                            <div style="font-weight: 500;">${msg.attachment.name}</div>
                            <div style="font-size: 14px; color: var(--text-secondary);">${Math.round(msg.attachment.size / 1024)} KB</div>
                        </div>
                    `;
                    messageDiv.appendChild(fileCard);
                }
            }

            if (msg.text) {
                if (msg.sender === 'ai') {
                    const rawHtml = marked.parse(msg.text);
                    const htmlContainer = document.createElement('div');
                    htmlContainer.className = 'markdown-body';
                    htmlContainer.innerHTML = DOMPurify.sanitize(rawHtml);
                    messageDiv.appendChild(htmlContainer);
                } else {
                    const textSpan = document.createElement('div');
                    textSpan.textContent = msg.text;
                    messageDiv.appendChild(textSpan);
                }
            }

            wrapper.appendChild(messageDiv);
            chatContainer.appendChild(wrapper);
        });

        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // ========================================
    // LONG-TERM MEMORY MODULE (localStorage)
    // ========================================
    const MEMORY_KEY = 'sentra_long_term_memory';

    function loadSentraMemory() {
        try {
            const data = localStorage.getItem(MEMORY_KEY);
            return data ? JSON.parse(data) : [];
        } catch (e) {
            return [];
        }
    }

    function saveSentraMemory(memoryArray) {
        try {
            localStorage.setItem(MEMORY_KEY, JSON.stringify(memoryArray));
        } catch (e) {}
    }

    function addMemory(fact) {
        if (!fact || typeof fact !== 'string') return;
        const clean = fact.trim();
        if (clean.length < 2) return;
        
        let memory = loadSentraMemory();
        if (!memory.includes(clean)) {
            memory.push(clean);
            saveSentraMemory(memory);
        }
    }

    function removeMemory(query) {
        let memory = loadSentraMemory();
        const lowerQuery = query.toLowerCase();
        const filtered = memory.filter(item => !item.toLowerCase().includes(lowerQuery));
        saveSentraMemory(filtered);
    }

    function getRelevantMemory(text) {
        let memory = loadSentraMemory();
        if (memory.length === 0) return "";
        
        const lower = text.toLowerCase();
        if (lower.includes('что ты помнишь') || lower.includes('о мне')) {
            return "Факты о пользователе:\n- " + memory.join("\n- ");
        }

        const words = lower.split(/\s+/).filter(w => w.length > 3);
        const relevant = memory.filter(item => {
            const itemLower = item.toLowerCase();
            return words.some(w => itemLower.includes(w));
        });

        if (relevant.length > 0) {
            return "Релевантный контекст:\n- " + relevant.join("\n- ");
        }
        
        return "Факты о пользователе: " + memory.join("; ");
    }

    function handleMemoryCommands(text) {
        const lower = text.toLowerCase().trim();

        if (lower === 'что ты помнишь обо мне?' || lower === 'что ты помнишь обо мне' || lower === 'что помнишь обо мне') {
            const memory = loadSentraMemory();
            if (memory.length === 0) {
                return "Я пока ничего не запомнила о тебе. Попроси меня: «Запомни, что меня зовут Алекс» или «Мой любимый цвет — синий».";
            }
            return "Вот что я помню о тебе:\n" + memory.map(m => "— " + m).join("\n");
        }

        if (lower.startsWith('забудь это') || lower.startsWith('забудь ')) {
            const target = text.replace(/^забудь\s+(это)?/i, '').trim();
            if (!target || target.toLowerCase() === 'это') {
                localStorage.removeItem(MEMORY_KEY);
                return "Я полностью очистила всю долговременную память о тебе.";
            } else {
                removeMemory(target);
                return `Я удалила из памяти информацию, связанную с: "${target}"`;
            }
        }

        let extractedFact = null;
        if (lower.startsWith('запомни, что ')) {
            extractedFact = text.substring(13).trim();
        } else if (lower.startsWith('запомни: ')) {
            extractedFact = text.substring(9).trim();
        } else if (lower.startsWith('запомни ')) {
            extractedFact = text.substring(8).trim();
        } else if (lower.startsWith('меня зовут ')) {
            extractedFact = `Меня зовут ${text.substring(11).trim()}`;
        } else if (lower.startsWith('мой любимый ') || lower.startsWith('моя любимая ') || lower.startsWith('моё любимое ')) {
            extractedFact = text.trim();
        }

        if (extractedFact) {
            addMemory(extractedFact);
            return `Запомнила! Сохранила в долговременную память: «${extractedFact}».`;
        }

        return null;
    }

    function loadKnowledgeBase() {
        // Зарезервировано для инициализации баз знаний при необходимости
    }

    // ========================================
    // SENTRA VISION & IMAGE COMPRESSION CORE
    // ========================================
    async function convertImageToBase64(file, maxDimension = 1024, quality = 0.85) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height && width > maxDimension) {
                        height = Math.round((height * maxDimension) / width);
                        width = maxDimension;
                    } else if (height > maxDimension) {
                        width = Math.round((width * maxDimension) / height);
                        height = maxDimension;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    resolve(dataUrl);
                };
                img.onerror = (error) => reject(error);
                img.src = event.target.result;
            };
            reader.onerror = (error) => reject(error);
            reader.readAsDataURL(file);
        });
    }

    // ========================================
    // MESSAGE SUBMISSION & AI RESPONSE CORE
    // ========================================
    async function submitUserMessage() {
        if (!userInput) return;
        const text = userInput.value.trim();
        if (text.length === 0 && !pendingAttachment) return;

        const activeChat = chats.find(c => c.id === activeChatId);
        if (!activeChat) return;

        let base64ImageData = null;
        let attachmentDisplayUrl = null;

        if (pendingAttachment) {
            attachmentDisplayUrl = URL.createObjectURL(pendingAttachment);
            if (pendingAttachment.type.startsWith('image/')) {
                try {
                    base64ImageData = await convertImageToBase64(pendingAttachment, 1024, 0.85);
                } catch (e) {
                    console.error("Ошибка при обработке изображения для Vision:", e);
                }
            }
        }

        let attachmentData = null;
        if (pendingAttachment) {
            let storageImageUrl = base64ImageData;
            if (pendingAttachment.type.startsWith('image/') && base64ImageData) {
                try {
                    const imgElement = new Image();
                    imgElement.src = base64ImageData;
                    await new Promise((resolve) => { imgElement.onload = resolve; });
                    
                    const smallCanvas = document.createElement('canvas');
                    let sWidth = imgElement.width;
                    let sHeight = imgElement.height;
                    const maxStorageDim = 512;
                    if (sWidth > sHeight && sWidth > maxStorageDim) {
                        sHeight = Math.round((sHeight * maxStorageDim) / sWidth);
                        sWidth = maxStorageDim;
                    } else if (sHeight > maxStorageDim) {
                        sWidth = Math.round((sWidth * maxStorageDim) / sHeight);
                        sHeight = maxStorageDim;
                    }
                    smallCanvas.width = sWidth;
                    smallCanvas.height = sHeight;
                    const sCtx = smallCanvas.getContext('2d');
                    sCtx.drawImage(imgElement, 0, 0, sWidth, sHeight);
                    storageImageUrl = smallCanvas.toDataURL('image/jpeg', 0.7);
                } catch (err) {
                    console.warn("Не удалось сжать превью для localStorage:", err);
                }
            }

            attachmentData = {
                name: pendingAttachment.name,
                size: pendingAttachment.size,
                type: pendingAttachment.type,
                url: storageImageUrl || attachmentDisplayUrl
            };
        }

        activeChat.messages.push({
            sender: 'user',
            text: text,
            attachment: attachmentData
        });

        if (activeChat.title === "Новый чат" && text.length > 0) {
            activeChat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
        }

        userInput.value = '';
        userInput.style.height = '24px';
        pendingAttachment = null;
        updateSendButtonState();

        saveChats();
        renderChatList();
        renderMessages();

        const memoryResponse = handleMemoryCommands(text);

        if (sendBtn) {
            sendBtn.classList.add('animating');
            setTimeout(() => sendBtn.classList.remove('animating'), 300);
        }

        const loadingWrapper = document.createElement('div');
        loadingWrapper.className = 'message-wrapper ai';
        loadingWrapper.id = 'loading-indicator';
        
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message ai';
        loadingDiv.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
        loadingWrapper.appendChild(loadingDiv);
        chatContainer.appendChild(loadingWrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        try {
            let aiReply = "";

            if (memoryResponse) {
                aiReply = memoryResponse;
            } else {
                const memoryContext = getRelevantMemory(text);
                
                const safeContext = activeChat.messages.slice(-6).map(msg => ({
                    role: msg.sender,
                    text: msg.text
                }));

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: text || "Опиши это изображение",
                        context: safeContext,
                        memoryContext: memoryContext,
                        imageData: base64ImageData
                    })
                });

                if (!response.ok) {
                    throw new Error(`Ошибка сервера: ${response.status}`);
                }

                const data = await response.json();
                aiReply = data.answer || data.reply || data.response || "Получен пустой ответ от сервера.";
            }

            const indicator = document.getElementById('loading-indicator');
            if (indicator) indicator.remove();

            activeChat.messages.push({
                sender: 'ai',
                text: aiReply,
                attachment: null
            });

            saveChats();
            renderMessages();

        } catch (error) {
            console.error("Ошибка при отправке запроса в /api/chat:", error);
            const indicator = document.getElementById('loading-indicator');
            if (indicator) indicator.remove();

            activeChat.messages.push({
                sender: 'ai',
                text: "⚠️ **Ошибка связи с нейросетью.** Не удалось отправить запрос на сервер или получить ответ.",
                attachment: null
            });

            saveChats();
            renderMessages();
        }
    }
